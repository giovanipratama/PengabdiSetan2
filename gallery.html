<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gallery - Pengabdi Setan 2</title>
<style>
    body {
        font-family: "Times New Roman", Times, serif;
        margin: 0;
        padding: 30px;
        color: #eae6da;
        background: radial-gradient(circle at top, #1a1a1a 0%, #0a0a0c 70%);
        background-attachment: fixed;
    }
    h1 {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #d4af37;
        letter-spacing: 1px;
        text-shadow: 0 0 8px rgba(212,175,55,0.4);
    }
    .subtitle {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 10px;
        color: #b3aca0;
        font-style: italic;
    }
    hr {
        border: none;
        border-top: 2px solid #d4af37;
        margin: 10px 0;
        opacity: 0.6;
    }
    .menu {
        font-size: 18px;
        margin: 15px 0;
    }
    .menu a {
        color: #eae6da;
        text-decoration: none;
        margin-right: 40px;
        transition: color 0.2s;
    }
    .menu a:hover {
        color: #d4af37;
        text-decoration: underline;
    }
    h2 {
        font-size: 22px;
        margin-top: 30px;
        color: #d4af37;
        border-bottom: 2px solid #d4af37;
        padding-bottom: 5px;
    }
    .gallery-single {
        margin-top: 20px;
        text-align: center;
    }
    .gallery-single img {
        max-width: 350px;
        width: 100%;
        height: auto;
        border: 2px solid #d4af37;
        border-radius: 6px;
        box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }
    /* Styling untuk Grid 5 Poster dengan Ukuran Sama */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .gallery-item {
        text-align: center;
        background: rgba(26, 26, 26, 0.8);
        padding: 10px;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .gallery-item img {
        width: 100%;
        height: 300px; /* Menyamakan tinggi semua poster */
        object-fit: cover; /* Menjaga proporsi gambar agar tidak gepeng */
        border: 1px solid #d4af37;
        border-radius: 4px;
    }
    .gallery-item p {
        font-size: 14px;
        color: #b3aca0;
        margin-top: 8px;
        margin-bottom: 0;
    }
    .signature-line {
        border-top: 2px solid #3a3a3a;
        margin: 30px 0 10px 0;
    }
    footer {
        font-size: 14px;
        color: #777;
        margin-top: 10px;
        text-align: center;
    }
</style>
</head>
<body>

    <h1>Pengabdi Setan 2</h1>
    <p class="subtitle">Gallery Foto</p>

    <hr>

        <a href="membership.html">Membership</a> 
    </div>

        <div class="gallery-item">
            <img src="Pegabdisetan 1.jpg" alt="Pegabdi Setan 1">
            <p>Pegabdi Setan 1</p>
        </div>
        <div class="gallery-item">
            <img src="PengabdiSetan2.jpg" alt="Pegabdi setan 2">
            <p>Pegabdi setan 2</p>
        </div>
        <div class="gallery-item">
            <img src="sewu.jpg" alt="sewu dino">
            <p>sewu dino</p>
        </div>
        <div class="gallery-item">
            <img src="desapenari.jpg" alt="Kkn Di Desa Penari">
            <p>Kkn Di Desa Penari</p>
        </div>
        <div class="gallery-item">
            <img src="impetigore.jpg" alt="Impetigore">
            <p>Impetigore</p>
        </div>
    </div>

    <div class="signature-line"></div>

    <p style="text-align:center; color:#d8d3c6; font-size:14px;">Giovani &copy; 2026 Pengabdi Setan 2: Communion. Semua hak cipta dilindungi undang-undang</p>

</body>
</html>
